name: Seed Live Database

on:
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  seed:
    name: Run Database Seed Script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run Seed Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.24.193.227
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /root/odhvica-ecommerce/deploy/hostinger
            docker compose exec -T backend node dist/seed-real-data.js
            
            echo "✅ Seed Complete!"
