# ============================================================
# Odhvica — Nginx config for Hostinger VPS
# Domains: odhvica.com | admin.odhvica.com | api.odhvica.com | mcp.odhvica.com
#
# SSL certs are managed by Certbot (Let's Encrypt).
# Run once to get certs:
#   certbot --nginx -d odhvica.com -d www.odhvica.com \
#           -d admin.odhvica.com -d api.odhvica.com -d mcp.odhvica.com
# Certbot will edit this file automatically with SSL blocks.
# ============================================================

# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name odhvica.com www.odhvica.com admin.odhvica.com api.odhvica.com mcp.odhvica.com;
    return 301 https://$host$request_uri;
}

# ── Storefront (odhvica.com) ────────────────────────────────
server {
    listen 443 ssl;
    server_name odhvica.com www.odhvica.com;

    client_max_body_size 100m;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/odhvica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odhvica.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ── Admin Panel (admin.odhvica.com) ─────────────────────────
server {
    listen 443 ssl;
    server_name admin.odhvica.com;

    client_max_body_size 100m;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/odhvica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odhvica.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── Backend API (api.odhvica.com) ───────────────────────────
server {
    listen 443 ssl;
    server_name api.odhvica.com;

    client_max_body_size 100m;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/odhvica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odhvica.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── MCP Server (mcp.odhvica.com) ────────────────────────────
server {
    listen 443 ssl;
    server_name mcp.odhvica.com;

    client_max_body_size 100m;

    # SSL — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/odhvica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odhvica.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
